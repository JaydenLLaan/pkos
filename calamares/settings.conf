modules-search: [local]
branding: pkos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel-during-exec: true
instances:
  - id: prepare
    module: shellprocess
    config: prepare.conf
  - id: finish
    module: shellprocess
    config: finish.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - shellprocess@prepare
      - machineid
      - luksbootkeyfile
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - grubcfg
      - initramfscfg
      - initramfs
      - bootloader
      - shellprocess@finish
      - umount
  - show:
      - finished

