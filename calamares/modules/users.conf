userGroup: users
defaultGroups: [sudo, video, render, audio, netdev, plugdev, bluetooth]
sudoersGroup: sudo
sudoersConfigureWithGroup: true
setRootPassword: false
doAutologin: true
allowWeakPasswords: false
passwordRequirements:
  minLength: 8
  maxLength: -1
user:
  shell: /bin/bash
  home_permissions: o700
hostname:
  location: EtcFile
  writeHostsFile: true
  template: pkos
  forbidden_names: [localhost]

